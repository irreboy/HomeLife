# Compila Mi Día para Android y firma el resultado.
#
# Produce dos archivos:
#   - .aab  : para subir a Google Play (es el formato que Play exige).
#   - .apk  : para instalar directo en un teléfono, útil para probar.
#
# La clave de firma nunca está en el repositorio: llega desde los secretos
# del repositorio y se borra del disco al terminar.

name: Compilar Android

on:
  workflow_dispatch:
    inputs:
      publicar:
        description: "Crear además una Release con la APK"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que el proyecto nativo existe
        run: |
          if [ ! -d android ]; then
            echo "Falta la carpeta android/."
            echo "Ejecuta primero el flujo «Crear proyecto Android (una vez)»."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: npm ci || npm install

      - name: Revisar la sintaxis de la aplicación
        run: npm run check

      - name: Copiar la aplicación web al proyecto nativo
        run: npx cap sync android

      # El código de versión debe subir en cada entrega a Play. Se usa el
      # número de ejecución del flujo, que nunca retrocede.
      - name: Fijar versión
        run: |
          VERSION_NAME=$(node -p "require('./package.json').version")
          VERSION_CODE=${{ github.run_number }}
          echo "Versión $VERSION_NAME (código $VERSION_CODE)"
          sed -i "s/versionCode .*/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"$VERSION_NAME\"/" android/app/build.gradle
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Preparar la clave de firma
        id: firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Sin secreto ANDROID_KEYSTORE_BASE64: se compilará sin firmar."
            echo "firmado=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/firma.jks"
            echo "firmado=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilar
        working-directory: android
        env:
          FIRMADO: ${{ steps.firma.outputs.firmado }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "$FIRMADO" = "true" ]; then
            # Inyectar la firma por propiedades evita tocar build.gradle.
            FIRMA_ARGS="-Pandroid.injected.signing.store.file=$RUNNER_TEMP/firma.jks \
                        -Pandroid.injected.signing.store.password=$STORE_PASSWORD \
                        -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
                        -Pandroid.injected.signing.key.password=$KEY_PASSWORD"
          else
            FIRMA_ARGS=""
          fi
          ./gradlew bundleRelease assembleRelease --no-daemon $FIRMA_ARGS

      - name: Borrar la clave del disco
        if: always()
        run: rm -f "$RUNNER_TEMP/firma.jks"

      - name: Renombrar los archivos
        run: |
          mkdir -p entrega
          find android/app/build/outputs -name "*.aab" -exec cp {} "entrega/mi-dia-${{ env.VERSION_NAME }}.aab" \;
          find android/app/build/outputs -name "*release*.apk" -exec cp {} "entrega/mi-dia-${{ env.VERSION_NAME }}.apk" \;
          ls -lh entrega

      - uses: actions/upload-artifact@v4
        with:
          name: mi-dia-android
          path: entrega/*
          retention-days: 30

      - name: Publicar una Release con la APK
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ETIQUETA="${{ github.ref_type == 'tag' && github.ref_name || format('v{0}-build{1}', env.VERSION_NAME, github.run_number) }}"
          gh release create "$ETIQUETA" entrega/*.apk \
            --title "Mi Día $ETIQUETA" \
            --notes "Instalable para Android. El archivo .aab de Google Play está en los artefactos de la ejecución." \
            || gh release upload "$ETIQUETA" entrega/*.apk --clobber
